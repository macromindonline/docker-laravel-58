# ModSecurity 2.9 + OWASP Core Rule Set 3.3.5
# Engine mode controlado em runtime via env var MODSEC_ENGINE
# (Off | DetectionOnly | On) — ver apache2-foreground.

<IfModule security2_module>
    SecDataDir /tmp

    Include /etc/modsecurity/modsecurity.conf
    Include /etc/modsecurity/crs/crs-setup.conf
    Include /etc/modsecurity/crs/rules/*.conf
</IfModule>
