# mod_remoteip — extrai IP real do cliente do header X-Forwarded-For
# Skudonet (e qualquer LB privado) cai automaticamente nos ranges abaixo.
# IPs/CIDRs adicionais (ex: LB público) podem ser injetados em runtime via
# variável de ambiente TRUSTED_PROXIES no apache2-foreground.

RemoteIPHeader X-Forwarded-For

# RFC1918 — redes privadas (qualquer LB dentro da VPC/rede interna)
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16
RemoteIPInternalProxy 127.0.0.1/8

# Logs passam a registrar IP real (%a) em vez do proxy (%h)
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
