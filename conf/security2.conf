# ModSecurity 2.9 + OWASP Core Rule Set 3.3.5
# Engine mode controlado em runtime via env var MODSEC_ENGINE
# (Off | DetectionOnly | On) — ver apache2-foreground.

<IfModule security2_module>
    SecDataDir /tmp

    Include /etc/modsecurity/modsecurity.conf
    Include /etc/modsecurity/crs/crs-setup.conf

    # Permite métodos REST usados pela aplicação (PUT/DELETE/PATCH).
    # Default CRS bloqueia tudo fora de GET/HEAD/POST/OPTIONS via regra 911100.
    SecAction "id:900200,phase:1,nolog,pass,t:none,\
        setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT DELETE PATCH'"

    Include /etc/modsecurity/crs/rules/*.conf

    # ============================================================
    # Exclusões para falsos positivos conhecidos
    # ============================================================
    # Estratégia: remover apenas o param/URI específico das regras XSS
    # (941xxx), não desabilitar as regras inteiras. Mantém proteção
    # contra XSS em todos os outros campos.

    # --- Uploads base64 (webchat, anexos, formulários com arquivos) ---
    # Param: arquivos.*.data → data:image/png;base64,iVBOR... (legítimo)
    # Regras: 941130 (XSS attribute), 941170 (NoScript)
    SecRule REQUEST_URI "@rx ^/webchat/" \
        "id:1000010,phase:1,pass,nolog,\
        ctl:ruleRemoveTargetById=941100;ARGS:arquivos.arquivos.data,\
        ctl:ruleRemoveTargetById=941130;ARGS:arquivos.arquivos.data,\
        ctl:ruleRemoveTargetById=941160;ARGS:arquivos.arquivos.data,\
        ctl:ruleRemoveTargetById=941170;ARGS:arquivos.arquivos.data,\
        ctl:ruleRemoveTargetById=941180;ARGS:arquivos.arquivos.data,\
        ctl:ruleRemoveTargetById=941310;ARGS:arquivos.arquivos.data,\
        ctl:ruleRemoveTargetById=941350;ARGS:arquivos.arquivos.data"

    # --- Campos de texto rico (editor TinyMCE/CKEditor) ---
    # Param: *_observacoes, *_descricao, *_corpo, *_conteudo, *_mensagem
    # Regras XSS pegam HTML legítimo (<table>, <p>, atributos style)
    SecRule REQUEST_FILENAME "@rx \.(php|html?|)$|^/[^.]+$" \
        "id:1000020,phase:1,pass,nolog,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:/_observacoes$/,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:/_descricao$/,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:/_corpo$/,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:/_conteudo$/,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:/_mensagem$/,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:/_html$/,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:/_texto$/"
</IfModule>
